name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Package tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Run tests
        run: vendor/bin/phpunit

  lint:
    name: Pint (code style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Check code style
        run: vendor/bin/pint --test

  build-drift:
    name: stubs/ is in sync with apps/demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo
          coverage: none
      - name: Install demo dependencies
        working-directory: apps/demo
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Regenerate the package from the authored source
        run: bash scripts/build-package.sh
      - name: Fail if stubs/ is stale or was hand-edited
        run: |
          if ! git diff --quiet -- stubs; then
            echo "::error::stubs/ is out of sync with apps/demo."
            echo "Components are AUTHORED in apps/demo/resources/views/components/ui/ and GENERATED into"
            echo "stubs/. Edit the demo source, run 'bash scripts/build-package.sh', and commit."
            git diff --stat -- stubs
            exit 1
          fi
          echo "✓ stubs/ match the authored demo source."
