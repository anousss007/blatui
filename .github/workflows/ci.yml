name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Package tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Run tests
        run: vendor/bin/phpunit

  engine-tests:
    name: JS engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Zero-dependency: the tests strip the engine's Alpine/floating-ui imports and drive the
      # component factories directly, so there is nothing to install.
      - name: Run the engine tests
        working-directory: apps/demo
        run: npm test

  lint:
    name: Pint (code style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Check code style
        run: vendor/bin/pint --test

  build-drift:
    name: stubs/ is in sync with apps/demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo
          coverage: none
      - name: Install demo dependencies
        working-directory: apps/demo
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Regenerate the package from the authored source
        run: bash scripts/build-package.sh
      - name: Fail if stubs/ is stale or was hand-edited
        run: |
          if ! git diff --quiet -- stubs; then
            echo "::error::stubs/ is out of sync with apps/demo."
            echo "Components are AUTHORED in apps/demo/resources/views/components/ui/ and GENERATED into"
            echo "stubs/. Edit the demo source, run 'bash scripts/build-package.sh', and commit."
            git diff --stat -- stubs
            exit 1
          fi
          echo "✓ stubs/ match the authored demo source."

  starter-drift:
    name: apps/starter is in sync with apps/demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the starter from the authored source
        run: bash scripts/build-starter.sh
      - name: Fail if the starter's generated files are stale
        run: |
          paths="apps/starter/resources/views/components/ui \
                 apps/starter/resources/views/components/block \
                 apps/starter/resources/css/blatui.css \
                 apps/starter/resources/js/blatui-core.js \
                 apps/starter/resources/js/blatui.js \
                 apps/starter/resources/js/blatui-charts.js"
          if ! git diff --quiet -- $paths; then
            echo "::error::apps/starter is out of sync with apps/demo."
            echo "The starter's components + foundations are GENERATED from apps/demo. Edit the demo"
            echo "source, run 'bash scripts/build-starter.sh', and commit."
            git diff --stat -- $paths
            exit 1
          fi
          echo "✓ starter matches the authored demo source."

  starter-tests:
    name: Starter kit boots and renders
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/starter
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Render tests (pages compile every ui/block/layout component)
        run: php artisan test
      - name: Install JS dependencies
        run: npm ci
      - name: Build front-end assets
        run: npm run build

  browser-acceptance:
    # Every component, every width. Sharded across jobs by viewport so the whole matrix
    # finishes in the time one shard takes rather than eleven times that.
    name: Browser acceptance @ ${{ matrix.viewports }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        viewports:
          - "320,375,639"
          - "640,767,768"
          - "900,1023"
          - "1024,1280,1536"
    defaults:
      run:
        working-directory: apps/demo
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # 8.4 and `composer install`: this job runs the demo the way it is actually
          # locked, rather than re-resolving it like the drift check does.
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare environment
        # The demo keeps sessions, cache and queue in the database, and database.sqlite is
        # gitignored — without this every request 500s and the suite never gets a page.
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite
          php artisan migrate --force
      - name: Install JS dependencies
        run: npm ci
      - name: Build front-end assets
        run: npm run build
      # Playwright is not a devDependency (its postinstall would drag a ~115 MB browser
      # download into every `npm install` in the demo), so it is installed only here.
      - name: Cache the Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/demo/package-lock.json') }}
      - name: Install Playwright
        run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - name: Serve the demo
        # Multiple workers: the suite drives four pages in parallel and a single-threaded
        # dev server would serialise the whole run behind PHP.
        run: |
          PHP_CLI_SERVER_WORKERS=8 php artisan serve --port=8123 &
          # Wait for the sitemap specifically: it is what the runner reads to discover
          # every component and block, so a server that answers but cannot serve it is
          # not ready. Print what it did answer, otherwise a red run says nothing.
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8123/sitemap.xml -o /tmp/sitemap.xml && break
            sleep 1
          done
          grep -q '<loc>' /tmp/sitemap.xml 2>/dev/null || {
            echo "::error::the demo did not serve a usable sitemap.xml"
            curl -s -o /tmp/probe.html -w 'sitemap %{http_code}, home %{http_code}\n' http://127.0.0.1:8123/sitemap.xml
            head -c 1000 /tmp/probe.html
            exit 1
          }
      # Asserts on COMPUTED state after real interactions — the layer that would have caught
      # the invisible mobile drawer (#16), which every markup-level test passed straight through.
      - name: Run the browser acceptance suite
        run: node tests/browser/run.mjs http://127.0.0.1:8123 --viewports=${{ matrix.viewports }}
      - name: Show the demo's log if anything failed
        if: failure()
        run: tail -n 60 storage/logs/laravel.log || true
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-shots-${{ strategy.job-index }}
          path: apps/demo/tests/browser/shots/
          if-no-files-found: ignore
